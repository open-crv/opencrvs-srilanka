all:
  vars:
    single_node: true
    users:
      # @todo this is where you define which development team members have access to the server.
      # If you need to remove access from someone, do not remove them from this list, but instead set their state: absent
      - name: provision
        ssh_keys:
          - ssh-rsa  provision@crvs
        state: present
        sudoer: true
      - name: barry
        ssh_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICw4vvV33xxrTzxAiPoRhuwyWUzmgrP5NPo2n4bmKx7P
        state: present
        sudoer: true
    enable_backups: false
docker-manager-first:
  hosts:
    crvs: # @todo set this to be the hostname of your target server
      ansible_host: '124.43.177.246' # @todo set this to be the IP address of your server
      data_label: data1 # for manager machines, this should always be "data1"

# Development servers are not configured to use workers.
docker-workers: {}
